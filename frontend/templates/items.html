{% extends "base.html" %}

{% block title %}My E-Waste Items - E-Waste Management System{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <!-- Header -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="mb-1">
                        <i class="fas fa-list text-primary me-2"></i>My E-Waste Items
                    </h2>
                    <p class="text-muted mb-0">Manage and track all your registered electronic waste items</p>
                </div>
                <button class="btn btn-success" onclick="showAddItemModal()">
                    <i class="fas fa-plus me-2"></i>Add New Item
                </button>
            </div>
        </div>
    </div>

    <!-- Search and Filter -->
    <div class="row mb-4">
        <div class="col-md-6 mb-3">
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input type="text" class="form-control" id="searchItems" placeholder="Search items...">
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <select class="form-select" id="filterStatus">
                <option value="">All Status</option>
                <option value="registered">Registered</option>
                <option value="collected">Collected</option>
                <option value="processed">Processed</option>
                <option value="recycled">Recycled</option>
            </select>
        </div>
        <div class="col-md-3 mb-3">
            <select class="form-select" id="filterCategory">
                <option value="">All Categories</option>
            </select>
        </div>
    </div>

    <!-- Items Grid -->
    <div class="row" id="itemsContainer">
        <div class="col-12">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Loading your e-waste items...</p>
            </div>
        </div>
    </div>
</div>

<!-- Edit Item Modal -->
<div class="modal fade" id="editItemModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-edit text-primary me-2"></i>Edit E-Waste Item
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editItemForm">
                    <input type="hidden" id="editItemId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="editItemName" class="form-label">Item Name *</label>
                            <input type="text" class="form-control" id="editItemName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="editItemCategory" class="form-label">Category *</label>
                            <select class="form-select" id="editItemCategory" required>
                                <option value="">Select Category</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="editItemBrand" class="form-label">Brand</label>
                            <input type="text" class="form-control" id="editItemBrand">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="editItemModel" class="form-label">Model</label>
                            <input type="text" class="form-control" id="editItemModel">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="editItemCondition" class="form-label">Condition</label>
                            <select class="form-select" id="editItemCondition">
                                <option value="working">Working</option>
                                <option value="partially_working">Partially Working</option>
                                <option value="broken">Broken</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="editItemWeight" class="form-label">Weight (kg)</label>
                            <input type="number" class="form-control" id="editItemWeight" step="0.1" min="0">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="editItemStatus" class="form-label">Status</label>
                            <select class="form-select" id="editItemStatus">
                                <option value="registered">Registered</option>
                                <option value="collected">Collected</option>
                                <option value="processed">Processed</option>
                                <option value="recycled">Recycled</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="editItemValue" class="form-label">Estimated Value (₹)</label>
                        <input type="number" class="form-control" id="editItemValue" step="0.01" min="0">
                    </div>
                    <div class="mb-3">
                        <label for="editItemDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="editItemDescription" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitEditItem()">
                    <i class="fas fa-save me-2"></i>Update Item
                </button>
            </div>
        </div>
    </div>
</div>

<style>
.item-card {
    transition: transform 0.2s, box-shadow 0.2s;
}

.item-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15) !important;
}

#navbar {
    display: block !important;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('access_token');
    if (!token) {
        window.location.href = '/';
        return;
    }
    
    loadCategories();
    loadItems();
    setupFilters();
});

let allItems = [];
let filteredItems = [];

async function loadCategories() {
    try {
        const token = localStorage.getItem('access_token');
        const response = await fetch('/api/ewaste/categories', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (response.ok) {
            const data = await response.json();
            const selects = ['filterCategory', 'editItemCategory'];
            
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                if (select) {
                    if (selectId === 'filterCategory') {
                        select.innerHTML = '<option value="">All Categories</option>';
                    } else {
                        select.innerHTML = '<option value="">Select Category</option>';
                    }
                    
                    data.categories.forEach(category => {
                        const option = document.createElement('option');
                        option.value = category.id;
                        option.textContent = category.name;
                        select.appendChild(option);
                    });
                }
            });
        }
    } catch (error) {
        console.error('Error loading categories:', error);
    }
}

async function loadItems() {
    try {
        const token = localStorage.getItem('access_token');
        const response = await fetch('/api/ewaste/items', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (response.ok) {
            const data = await response.json();
            allItems = data.items;
            filteredItems = [...allItems];
            displayItems();
        }
    } catch (error) {
        console.error('Error loading items:', error);
    }
}

function displayItems() {
    const container = document.getElementById('itemsContainer');
    
    if (filteredItems.length === 0) {
        container.innerHTML = `
            <div class="col-12">
                <div class="text-center py-5">
                    <i class="fas fa-inbox text-muted" style="font-size: 4rem;"></i>
                    <h4 class="mt-3 text-muted">No items found</h4>
                    <p class="text-muted">Add your first e-waste item to get started.</p>
                    <a href="/dashboard" class="btn btn-success">
                        <i class="fas fa-plus me-2"></i>Add Item
                    </a>
                </div>
            </div>
        `;
        return;
    }
    
    container.innerHTML = filteredItems.map(item => `
        <div class="col-lg-4 col-md-6 mb-4">
            <div class="card item-card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5 class="card-title mb-1">${item.name}</h5>
                            <p class="text-muted small mb-2">${item.brand || 'Unknown Brand'}</p>
                        </div>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#" onclick="editItem(${item.id})">
                                    <i class="fas fa-edit me-2"></i>Edit
                                </a></li>
                                <li><a class="dropdown-item" href="#" onclick="scheduleCollection(${item.id})">
                                    <i class="fas fa-calendar-plus me-2"></i>Schedule Collection
                                </a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-danger" href="#" onclick="deleteItem(${item.id})">
                                    <i class="fas fa-trash me-2"></i>Delete
                                </a></li>
                            </ul>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <span class="badge bg-${getStatusColor(item.status)}">${item.status.replace('_', ' ').toUpperCase()}</span>
                        <span class="badge bg-secondary ms-2">${item.condition.replace('_', ' ')}</span>
                    </div>
                    
                    <div class="row text-center mb-3">
                        <div class="col-6">
                            <small class="text-muted d-block">Category</small>
                            <strong class="small">${item.category_name || 'N/A'}</strong>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block">Est. Value</small>
                            <strong class="small">₹${(item.estimated_value || 0).toFixed(2)}</strong>
                        </div>
                    </div>
                    
                    <div class="mt-auto">
                        <small class="text-muted">
                            <i class="fas fa-calendar me-1"></i>
                            Added ${new Date(item.created_at).toLocaleDateString()}
                        </small>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
}

function setupFilters() {
    ['searchItems', 'filterStatus', 'filterCategory'].forEach(id => {
        const element = document.getElementById(id);
        if (element) {
            element.addEventListener('input', applyFilters);
        }
    });
}

function applyFilters() {
    const searchTerm = document.getElementById('searchItems').value.toLowerCase();
    const statusFilter = document.getElementById('filterStatus').value;
    const categoryFilter = document.getElementById('filterCategory').value;
    
    filteredItems = allItems.filter(item => {
        const matchesSearch = !searchTerm || 
            item.name.toLowerCase().includes(searchTerm) ||
            (item.brand && item.brand.toLowerCase().includes(searchTerm));
        
        const matchesStatus = !statusFilter || item.status === statusFilter;
        const matchesCategory = !categoryFilter || item.category_id == categoryFilter;
        
        return matchesSearch && matchesStatus && matchesCategory;
    });
    
    displayItems();
}

function getStatusColor(status) {
    switch (status) {
        case 'registered': return 'warning';
        case 'collected': return 'info';
        case 'processed': return 'primary';
        case 'recycled': return 'success';
        default: return 'secondary';
    }
}

function editItem(itemId) {
    const item = allItems.find(i => i.id === itemId);
    if (!item) return;
    
    document.getElementById('editItemId').value = item.id;
    document.getElementById('editItemName').value = item.name;
    document.getElementById('editItemCategory').value = item.category_id;
    document.getElementById('editItemBrand').value = item.brand || '';
    document.getElementById('editItemModel').value = item.model || '';
    document.getElementById('editItemCondition').value = item.condition;
    document.getElementById('editItemWeight').value = item.weight || '';
    document.getElementById('editItemStatus').value = item.status;
    document.getElementById('editItemValue').value = item.estimated_value || '';
    document.getElementById('editItemDescription').value = item.description || '';
    
    const modal = new bootstrap.Modal(document.getElementById('editItemModal'));
    modal.show();
}

async function submitEditItem() {
    const itemId = document.getElementById('editItemId').value;
    const itemData = {
        name: document.getElementById('editItemName').value,
        category_id: parseInt(document.getElementById('editItemCategory').value),
        brand: document.getElementById('editItemBrand').value,
        model: document.getElementById('editItemModel').value,
        condition: document.getElementById('editItemCondition').value,
        weight: parseFloat(document.getElementById('editItemWeight').value) || 0,
        status: document.getElementById('editItemStatus').value,
        estimated_value: parseFloat(document.getElementById('editItemValue').value) || 0,
        description: document.getElementById('editItemDescription').value
    };
    
    try {
        const token = localStorage.getItem('access_token');
        const response = await fetch(`/api/ewaste/items/${itemId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(itemData)
        });
        
        if (response.ok) {
            const modal = bootstrap.Modal.getInstance(document.getElementById('editItemModal'));
            modal.hide();
            await loadItems();
            showAlert('Item updated successfully!', 'success');
        } else {
            const error = await response.json();
            showAlert(error.error || 'Failed to update item', 'danger');
        }
    } catch (error) {
        showAlert('Network error. Please try again.', 'danger');
    }
}

function scheduleCollection(itemId) {
    localStorage.setItem('scheduleItemId', itemId);
    window.location.href = '/collections';
}

async function deleteItem(itemId) {
    if (!confirm('Are you sure you want to delete this item?')) return;
    
    try {
        const token = localStorage.getItem('access_token');
        const response = await fetch(`/api/ewaste/items/${itemId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (response.ok) {
            await loadItems();
            showAlert('Item deleted successfully!', 'success');
        }
    } catch (error) {
        showAlert('Network error. Please try again.', 'danger');
    }
}

function showAlert(message, type) {
    const alert = document.createElement('div');
    alert.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
    alert.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
    alert.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    document.body.appendChild(alert);
    
    setTimeout(() => {
        if (alert.parentNode) alert.remove();
    }, 5000);
}
</script>
{% endblock %}
